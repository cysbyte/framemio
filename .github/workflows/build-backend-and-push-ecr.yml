name: Build and push backend image to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend-and-push-ecr.yml'
      - 'scripts/deploy-ecs-service.sh'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: my-cluster
  ECS_SERVICE: framemio-backend-service-bvglq3iy
  ECS_TASK_DEFINITION: framemio-backend
  ECS_CONTAINER_NAME: Main
  ECS_TASK_ROLE_ARN: arn:aws:iam::450876624497:role/FramemioECSTaskRole
  ECS_EXECUTION_ROLE_ARN: arn:aws:iam::450876624497:role/ecsTaskExecutionRole
  ECS_SUBNETS: ${{ vars.ECS_SUBNETS || 'subnet-00d486ccc47c106c3,subnet-049030ce471097336,subnet-09957911ba06c489f,subnet-0207cfb1b59d111c0,subnet-059002c34faa60a13,subnet-0b38a6af4a720b169' }}
  ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS || 'sg-0621dd1b1173bd1c0' }}
  ECS_ASSIGN_PUBLIC_IP: ${{ vars.ECS_ASSIGN_PUBLIC_IP || 'ENABLED' }}
  ECS_SERVICE_DESIRED_COUNT: "1"
  ECS_REGISTER_SCALABLE_TARGET: "true"
  ECS_MIN_CAPACITY: "0"
  ECS_MAX_CAPACITY: "1"
  ECS_ENABLE_REQUEST_AUTOSCALING: "true"
  ECS_REQUEST_SCALE_OUT_CAPACITY: "1"
  ECS_REQUEST_SCALE_OUT_COOLDOWN: "60"
  ECS_REQUEST_SCALE_IN_COOLDOWN: "300"
  ECS_REQUEST_SCALE_OUT_EVALUATION_PERIODS: "1"
  ECS_REQUEST_SCALE_IN_EVALUATION_PERIODS: "5"
  DATABASE_PROVIDER: ${{ vars.DATABASE_PROVIDER || 'rds' }}
  DATABASE_URL: ${{ vars.DATABASE_URL }}
  DATABASE_URL_SECRET_ARN: ${{ vars.DATABASE_URL_SECRET_ARN || vars.NEON_DATABASE_URL_SECRET_ARN }}
  DATABASE_AUTH_MODE: ${{ vars.DATABASE_AUTH_MODE }}
  RDS_AUTO_START_ENABLED: ${{ vars.RDS_AUTO_START_ENABLED }}
  RDS_CLUSTER_IDENTIFIER: ${{ vars.RDS_CLUSTER_IDENTIFIER || 'my-db-cluster' }}
  PORT: "8080"
  INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
  DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
  STORY_PLANNER_PROVIDER: ${{ vars.STORY_PLANNER_PROVIDER || 'gemini' }}
  STORY_PLANNER_GEMINI_BASE_URL: ${{ vars.STORY_PLANNER_GEMINI_BASE_URL || vars.VIDEO_UNDERSTANDING_UPSTREAM_BASE_URL || vars.OPENAI_BASE_URL || 'https://api2.65535.space' }}
  STORY_PLANNER_GEMINI_MODEL: ${{ vars.STORY_PLANNER_GEMINI_MODEL || 'gemini-3.8-flash' }}
  STORY_PLANNER_GEMINI_API_KEY: ${{ secrets.STORY_PLANNER_GEMINI_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
  STORY_PLANNER_GEMINI_TIMEOUT: ${{ vars.STORY_PLANNER_GEMINI_TIMEOUT || '90s' }}
  STORY_PLANNER_GEMINI_FALLBACK_TIMEOUT: ${{ vars.STORY_PLANNER_GEMINI_FALLBACK_TIMEOUT || '80s' }}
  STORY_PLANNER_MODEL: ${{ vars.STORY_PLANNER_MODEL || 'gpt-5.6-luna' }}
  STORY_PLANNER_BASE_URL: ${{ vars.STORY_PLANNER_BASE_URL || vars.OPENAI_BASE_URL || 'https://api2.65535.space' }}
  STORY_PLANNER_API_KEY: ${{ secrets.STORY_PLANNER_API_KEY || secrets.OPENAI_API_KEY }}
  STORY_PLANNER_WIRE_API: ${{ vars.STORY_PLANNER_WIRE_API || 'chat_completions' }}
  STORY_PLANNER_MAX_OUTPUT_TOKENS: ${{ vars.STORY_PLANNER_MAX_OUTPUT_TOKENS || '6000' }}
  STORY_PLANNER_TIMEOUT: ${{ vars.STORY_PLANNER_TIMEOUT || '90s' }}
  STORY_PLANNER_FALLBACK_TIMEOUT: ${{ vars.STORY_PLANNER_FALLBACK_TIMEOUT || '80s' }}
  STORY_REVISION_PROVIDER: ${{ vars.STORY_REVISION_PROVIDER || 'openai-compatible' }}
  STORY_REVISION_MODEL: gpt-5.6-luna
  STORY_REVISION_BASE_URL: ${{ vars.STORY_REVISION_BASE_URL || vars.OPENAI_BASE_URL || 'https://api2.65535.space' }}
  STORY_REVISION_API_KEY: ${{ secrets.STORY_REVISION_API_KEY || secrets.OPENAI_API_KEY }}
  STORY_REVISION_WIRE_API: ${{ vars.STORY_REVISION_WIRE_API || 'chat_completions' }}
  STORY_REVISION_MAX_OUTPUT_TOKENS: ${{ vars.STORY_REVISION_MAX_OUTPUT_TOKENS || '6000' }}
  STORY_REVISION_TIMEOUT: ${{ vars.STORY_REVISION_TIMEOUT || '90s' }}
  STORY_REVISION_FALLBACK_TIMEOUT: ${{ vars.STORY_REVISION_FALLBACK_TIMEOUT || '45s' }}
  WORKER_RUN_ONCE_WAIT_TIMEOUT: ${{ vars.WORKER_RUN_ONCE_WAIT_TIMEOUT || '3m' }}
  SQS_VISIBILITY_TIMEOUT: ${{ vars.SQS_VISIBILITY_TIMEOUT || '3m' }}
  CREDIT_INITIAL_GRANT: ${{ vars.CREDIT_INITIAL_GRANT || '100' }}
  CREDIT_SUBSCRIPTION_MONTHLY_CYCLE_CREDITS: ${{ vars.CREDIT_SUBSCRIPTION_MONTHLY_CYCLE_CREDITS || '300' }}
  CREDIT_SUBSCRIPTION_YEARLY_CYCLE_CREDITS: ${{ vars.CREDIT_SUBSCRIPTION_YEARLY_CYCLE_CREDITS || '360' }}
  CREDIT_PACK_SMALL_CREDITS: ${{ vars.CREDIT_PACK_SMALL_CREDITS || '100' }}
  CREDIT_PACK_MEDIUM_CREDITS: ${{ vars.CREDIT_PACK_MEDIUM_CREDITS || '300' }}
  CREDIT_PACK_LARGE_CREDITS: ${{ vars.CREDIT_PACK_LARGE_CREDITS || '700' }}
  CREDIT_CREATE_STORY_MAX_VIDEO_SECONDS: ${{ vars.CREDIT_CREATE_STORY_MAX_VIDEO_SECONDS || '86400' }}
  CREDIT_DYNAMIC_STORY_PRICING: ${{ vars.CREDIT_DYNAMIC_STORY_PRICING || 'true' }}
  CREDIT_PACK_SMALL_PRODUCT_ID: ${{ vars.CREDIT_PACK_SMALL_PRODUCT_ID }}
  CREDIT_PACK_MEDIUM_PRODUCT_ID: ${{ vars.CREDIT_PACK_MEDIUM_PRODUCT_ID }}
  CREDIT_PACK_LARGE_PRODUCT_ID: ${{ vars.CREDIT_PACK_LARGE_PRODUCT_ID }}
  SQS_PROCESSING_QUEUE_URL: ${{ vars.SQS_PROCESSING_QUEUE_URL || 'https://sqs.us-east-1.amazonaws.com/450876624497/framemio-processing' }}
  SQS_STORY_QUEUE_URL: ${{ vars.SQS_STORY_QUEUE_URL || 'https://sqs.us-east-1.amazonaws.com/450876624497/framemio-story-processing' }}
  SQS_VIDEO_QUEUE_URL: ${{ vars.SQS_VIDEO_QUEUE_URL || 'https://sqs.us-east-1.amazonaws.com/450876624497/framemio-video-analysis' }}
  SQS_RENDER_QUEUE_URL: ${{ vars.SQS_RENDER_QUEUE_URL || 'https://sqs.us-east-1.amazonaws.com/450876624497/framemio-render-processing' }}
  MEDIA_DOWNLOAD_BASE_URL: ${{ vars.MEDIA_DOWNLOAD_BASE_URL || 'https://d3j31q5bw6z6w5.cloudfront.net' }}
  ECS_WORKER_RUN_TASK_ENABLED: "true"
  ECS_WORKER_RUN_TASK_JOB_TYPES: STORY_PLAN
  ECS_WORKER_CLUSTER: my-cluster
  ECS_WORKER_SUBNETS: ${{ vars.ECS_SUBNETS || 'subnet-00d486ccc47c106c3,subnet-049030ce471097336,subnet-09957911ba06c489f,subnet-0207cfb1b59d111c0,subnet-059002c34faa60a13,subnet-0b38a6af4a720b169' }}
  ECS_WORKER_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS || 'sg-0621dd1b1173bd1c0' }}
  ECS_WORKER_ASSIGN_PUBLIC_IP: ${{ vars.ECS_ASSIGN_PUBLIC_IP || 'ENABLED' }}
  VIDEO_WORKER_TASK_DEFINITION: framemio-video-intelligence-worker
  VIDEO_WORKER_CONTAINER_NAME: Main
  VIDEO_WORKER_SERVICE_NAME: ${{ vars.VIDEO_WORKER_SERVICE_NAME || 'framemio-video-intelligence-worker-service-xuttbpns' }}
  RENDER_WORKER_TASK_DEFINITION: framemio-render-worker
  RENDER_WORKER_CONTAINER_NAME: Main
  RENDER_WORKER_SERVICE_NAME: ${{ vars.RENDER_WORKER_SERVICE_NAME || 'framemio-render-worker-service-chw8cyt4' }}
  ECS_WORKER_SERVICE_SCALE_OUT_COUNT: ${{ vars.ECS_WORKER_SERVICE_SCALE_OUT_COUNT || '2' }}
  BACKEND_WORKER_TASK_DEFINITION: framemio-backend
  BACKEND_WORKER_CONTAINER_NAME: Main
  INTERNAL_API_TOKEN_SECRET_ARN: ${{ vars.INTERNAL_API_TOKEN_SECRET_ARN }}
  DEEPGRAM_API_KEY_SECRET_ARN: ${{ vars.DEEPGRAM_API_KEY_SECRET_ARN }}
  STORY_PLANNER_GEMINI_API_KEY_SECRET_ARN: ${{ vars.STORY_PLANNER_GEMINI_API_KEY_SECRET_ARN || vars.GEMINI_API_KEY_SECRET_ARN || vars.GOOGLE_API_KEY_SECRET_ARN }}
  STORY_PLANNER_API_KEY_SECRET_ARN: ${{ vars.STORY_PLANNER_API_KEY_SECRET_ARN }}
  STORY_REVISION_API_KEY_SECRET_ARN: ${{ vars.STORY_REVISION_API_KEY_SECRET_ARN }}
  ECS_SET_ENV_VARS: DATABASE_PROVIDER,DATABASE_URL,DATABASE_AUTH_MODE,AWS_REGION,PORT,INTERNAL_API_TOKEN,CREDIT_INITIAL_GRANT,CREDIT_SUBSCRIPTION_MONTHLY_CYCLE_CREDITS,CREDIT_SUBSCRIPTION_YEARLY_CYCLE_CREDITS,CREDIT_PACK_SMALL_CREDITS,CREDIT_PACK_MEDIUM_CREDITS,CREDIT_PACK_LARGE_CREDITS,CREDIT_CREATE_STORY_MAX_VIDEO_SECONDS,CREDIT_DYNAMIC_STORY_PRICING,SQS_PROCESSING_QUEUE_URL,SQS_STORY_QUEUE_URL,SQS_VIDEO_QUEUE_URL,SQS_RENDER_QUEUE_URL,MEDIA_DOWNLOAD_BASE_URL,ECS_WORKER_RUN_TASK_ENABLED,ECS_WORKER_RUN_TASK_JOB_TYPES,ECS_WORKER_CLUSTER,ECS_WORKER_SUBNETS,ECS_WORKER_SECURITY_GROUPS,ECS_WORKER_ASSIGN_PUBLIC_IP,VIDEO_WORKER_TASK_DEFINITION,VIDEO_WORKER_CONTAINER_NAME,VIDEO_WORKER_SERVICE_NAME,RENDER_WORKER_TASK_DEFINITION,RENDER_WORKER_CONTAINER_NAME,RENDER_WORKER_SERVICE_NAME,ECS_WORKER_SERVICE_SCALE_OUT_COUNT,BACKEND_WORKER_TASK_DEFINITION,BACKEND_WORKER_CONTAINER_NAME,DEEPGRAM_API_KEY,STORY_PLANNER_PROVIDER,STORY_PLANNER_GEMINI_BASE_URL,STORY_PLANNER_GEMINI_MODEL,STORY_PLANNER_MODEL,STORY_PLANNER_BASE_URL,STORY_PLANNER_API_KEY,STORY_PLANNER_WIRE_API,STORY_PLANNER_MAX_OUTPUT_TOKENS,STORY_PLANNER_TIMEOUT,STORY_PLANNER_FALLBACK_TIMEOUT,STORY_PLANNER_GEMINI_TIMEOUT,STORY_PLANNER_GEMINI_FALLBACK_TIMEOUT,STORY_REVISION_PROVIDER,STORY_REVISION_MODEL,STORY_REVISION_BASE_URL,STORY_REVISION_API_KEY,STORY_REVISION_WIRE_API,STORY_REVISION_MAX_OUTPUT_TOKENS,STORY_REVISION_TIMEOUT,STORY_REVISION_FALLBACK_TIMEOUT,WORKER_RUN_ONCE_WAIT_TIMEOUT,SQS_VISIBILITY_TIMEOUT
  ECS_SET_OPTIONAL_ENV_VARS: CREDIT_PACK_SMALL_PRODUCT_ID,CREDIT_PACK_MEDIUM_PRODUCT_ID,CREDIT_PACK_LARGE_PRODUCT_ID,STORY_PLANNER_GEMINI_API_KEY

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve database deployment config
        run: |
          secret_env_vars=""
          if [ -n "$DATABASE_URL_SECRET_ARN" ]; then
            secret_env_vars="DATABASE_URL"
          fi
          for name in INTERNAL_API_TOKEN DEEPGRAM_API_KEY STORY_PLANNER_GEMINI_API_KEY STORY_PLANNER_API_KEY STORY_REVISION_API_KEY; do
            secret_arn_name="${name}_SECRET_ARN"
            if [ -n "${!secret_arn_name}" ]; then
              secret_env_vars="${secret_env_vars:+${secret_env_vars},}${name}"
            else
              echo "::warning::${secret_arn_name} is not configured; ${name} remains in the ECS task definition until migrated to Secrets Manager."
            fi
          done
          if [ -n "$secret_env_vars" ]; then
            echo "ECS_SET_SECRET_ENV_VARS=$secret_env_vars" >> "$GITHUB_ENV"
          fi

          case "$DATABASE_PROVIDER" in
            rds|aurora|aws-rds)
              echo "DATABASE_AUTH_MODE=${DATABASE_AUTH_MODE:-iam}" >> "$GITHUB_ENV"
              echo "RDS_AUTO_START_ENABLED=${RDS_AUTO_START_ENABLED:-true}" >> "$GITHUB_ENV"
              ;;
            neon)
              echo "DATABASE_AUTH_MODE=${DATABASE_AUTH_MODE:-password}" >> "$GITHUB_ENV"
              echo "RDS_AUTO_START_ENABLED=${RDS_AUTO_START_ENABLED:-false}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported DATABASE_PROVIDER: $DATABASE_PROVIDER" >&2
              exit 1
              ;;
          esac

      - name: Validate deployment variables
        env:
          ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        run: |
          test -n "$AWS_REGION" || { echo "Missing repository variable AWS_REGION"; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo "Missing repository variable BACKEND_ECR_REPOSITORY"; exit 1; }
          test -n "$ROLE_ARN" || { echo "Missing repository secret AWS_GITHUB_ACTIONS_ROLE_ARN"; exit 1; }
          test -n "$DATABASE_PROVIDER" || { echo "Missing DATABASE_PROVIDER"; exit 1; }
          if [ -z "$DATABASE_URL" ] && [ -z "$DATABASE_URL_SECRET_ARN" ]; then
            echo "Missing DATABASE_URL repository variable or DATABASE_URL_SECRET_ARN repository variable" >&2
            exit 1
          fi
          test -n "$DATABASE_AUTH_MODE" || { echo "Missing DATABASE_AUTH_MODE"; exit 1; }
          if [ "$RDS_AUTO_START_ENABLED" = "true" ]; then
            test -n "$RDS_CLUSTER_IDENTIFIER" || { echo "Missing RDS_CLUSTER_IDENTIFIER while RDS auto-start is enabled"; exit 1; }
          fi
          test -n "$SQS_PROCESSING_QUEUE_URL" || { echo "Missing repository variable SQS_PROCESSING_QUEUE_URL"; exit 1; }
          test -n "$SQS_STORY_QUEUE_URL" || { echo "Missing SQS_STORY_QUEUE_URL"; exit 1; }
          test -n "$SQS_VIDEO_QUEUE_URL" || { echo "Missing SQS_VIDEO_QUEUE_URL"; exit 1; }
          test -n "$SQS_RENDER_QUEUE_URL" || { echo "Missing SQS_RENDER_QUEUE_URL"; exit 1; }
          if [ "$SQS_STORY_QUEUE_URL" = "$SQS_VIDEO_QUEUE_URL" ] || [ "$SQS_STORY_QUEUE_URL" = "$SQS_RENDER_QUEUE_URL" ] || [ "$SQS_VIDEO_QUEUE_URL" = "$SQS_RENDER_QUEUE_URL" ]; then
            echo "SQS_STORY_QUEUE_URL, SQS_VIDEO_QUEUE_URL, and SQS_RENDER_QUEUE_URL must be distinct in production" >&2
            exit 1
          fi
          if [ "$SQS_STORY_QUEUE_URL" = "$SQS_PROCESSING_QUEUE_URL" ] || [ "$SQS_VIDEO_QUEUE_URL" = "$SQS_PROCESSING_QUEUE_URL" ] || [ "$SQS_RENDER_QUEUE_URL" = "$SQS_PROCESSING_QUEUE_URL" ]; then
            echo "Dedicated production queues must not resolve to SQS_PROCESSING_QUEUE_URL" >&2
            exit 1
          fi
          test -n "$MEDIA_DOWNLOAD_BASE_URL" || { echo "Missing MEDIA_DOWNLOAD_BASE_URL"; exit 1; }
          [ -n "$INTERNAL_API_TOKEN" ] || [ -n "$INTERNAL_API_TOKEN_SECRET_ARN" ] || { echo "Missing repository secret INTERNAL_API_TOKEN or variable INTERNAL_API_TOKEN_SECRET_ARN"; exit 1; }
          test -n "$STORY_PLANNER_PROVIDER" || { echo "Missing STORY_PLANNER_PROVIDER"; exit 1; }
          case "$STORY_PLANNER_PROVIDER" in
            gemini|gemini-agentic|gemini_agentic|gemini-interactions|gemini_interactions)
              test -n "$STORY_PLANNER_GEMINI_BASE_URL" || { echo "Missing STORY_PLANNER_GEMINI_BASE_URL"; exit 1; }
              test -n "$STORY_PLANNER_GEMINI_MODEL" || { echo "Missing STORY_PLANNER_GEMINI_MODEL"; exit 1; }
              [ -n "$STORY_PLANNER_GEMINI_API_KEY" ] || [ -n "$STORY_PLANNER_GEMINI_API_KEY_SECRET_ARN" ] || { echo "Missing repository secret STORY_PLANNER_GEMINI_API_KEY/GEMINI_API_KEY or variable STORY_PLANNER_GEMINI_API_KEY_SECRET_ARN"; exit 1; }
              test -n "$STORY_PLANNER_GEMINI_TIMEOUT" || { echo "Missing STORY_PLANNER_GEMINI_TIMEOUT"; exit 1; }
              test -n "$STORY_PLANNER_GEMINI_FALLBACK_TIMEOUT" || { echo "Missing STORY_PLANNER_GEMINI_FALLBACK_TIMEOUT"; exit 1; }
              ;;
          esac
          test -n "$STORY_PLANNER_MODEL" || { echo "Missing STORY_PLANNER_MODEL"; exit 1; }
          test -n "$STORY_PLANNER_BASE_URL" || { echo "Missing STORY_PLANNER_BASE_URL"; exit 1; }
          [ -n "$STORY_PLANNER_API_KEY" ] || [ -n "$STORY_PLANNER_API_KEY_SECRET_ARN" ] || { echo "Missing repository secret STORY_PLANNER_API_KEY/OPENAI_API_KEY or variable STORY_PLANNER_API_KEY_SECRET_ARN"; exit 1; }
          test -n "$STORY_PLANNER_WIRE_API" || { echo "Missing STORY_PLANNER_WIRE_API"; exit 1; }
          test -n "$STORY_PLANNER_MAX_OUTPUT_TOKENS" || { echo "Missing STORY_PLANNER_MAX_OUTPUT_TOKENS"; exit 1; }
          test -n "$STORY_PLANNER_TIMEOUT" || { echo "Missing STORY_PLANNER_TIMEOUT"; exit 1; }
          test -n "$STORY_PLANNER_FALLBACK_TIMEOUT" || { echo "Missing STORY_PLANNER_FALLBACK_TIMEOUT"; exit 1; }
          test -n "$STORY_REVISION_PROVIDER" || { echo "Missing STORY_REVISION_PROVIDER"; exit 1; }
          test -n "$STORY_REVISION_MODEL" || { echo "Missing STORY_REVISION_MODEL"; exit 1; }
          test -n "$STORY_REVISION_BASE_URL" || { echo "Missing STORY_REVISION_BASE_URL"; exit 1; }
          [ -n "$STORY_REVISION_API_KEY" ] || [ -n "$STORY_REVISION_API_KEY_SECRET_ARN" ] || { echo "Missing repository secret STORY_REVISION_API_KEY/OPENAI_API_KEY or variable STORY_REVISION_API_KEY_SECRET_ARN"; exit 1; }
          test -n "$STORY_REVISION_WIRE_API" || { echo "Missing STORY_REVISION_WIRE_API"; exit 1; }
          test -n "$STORY_REVISION_MAX_OUTPUT_TOKENS" || { echo "Missing STORY_REVISION_MAX_OUTPUT_TOKENS"; exit 1; }
          test -n "$STORY_REVISION_TIMEOUT" || { echo "Missing STORY_REVISION_TIMEOUT"; exit 1; }
          test -n "$STORY_REVISION_FALLBACK_TIMEOUT" || { echo "Missing STORY_REVISION_FALLBACK_TIMEOUT"; exit 1; }
          test -n "$CREDIT_INITIAL_GRANT" || { echo "Missing CREDIT_INITIAL_GRANT"; exit 1; }
          test -n "$CREDIT_SUBSCRIPTION_MONTHLY_CYCLE_CREDITS" || { echo "Missing CREDIT_SUBSCRIPTION_MONTHLY_CYCLE_CREDITS"; exit 1; }
          test -n "$CREDIT_SUBSCRIPTION_YEARLY_CYCLE_CREDITS" || { echo "Missing CREDIT_SUBSCRIPTION_YEARLY_CYCLE_CREDITS"; exit 1; }
          test -n "$CREDIT_PACK_SMALL_CREDITS" || { echo "Missing CREDIT_PACK_SMALL_CREDITS"; exit 1; }
          test -n "$CREDIT_PACK_MEDIUM_CREDITS" || { echo "Missing CREDIT_PACK_MEDIUM_CREDITS"; exit 1; }
          test -n "$CREDIT_PACK_LARGE_CREDITS" || { echo "Missing CREDIT_PACK_LARGE_CREDITS"; exit 1; }
          test -n "$ECS_WORKER_SUBNETS" || { echo "Missing repository variable ECS_SUBNETS"; exit 1; }
          test -n "$ECS_WORKER_SECURITY_GROUPS" || { echo "Missing repository variable ECS_SECURITY_GROUPS"; exit 1; }
          test -n "$VIDEO_WORKER_TASK_DEFINITION" || { echo "Missing VIDEO_WORKER_TASK_DEFINITION"; exit 1; }
          test -n "$VIDEO_WORKER_SERVICE_NAME" || { echo "Missing VIDEO_WORKER_SERVICE_NAME"; exit 1; }
          test -n "$RENDER_WORKER_TASK_DEFINITION" || { echo "Missing RENDER_WORKER_TASK_DEFINITION"; exit 1; }
          test -n "$RENDER_WORKER_SERVICE_NAME" || { echo "Missing RENDER_WORKER_SERVICE_NAME"; exit 1; }
          test -n "$BACKEND_WORKER_TASK_DEFINITION" || { echo "Missing BACKEND_WORKER_TASK_DEFINITION"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-skip-session-tagging: true
          role-session-name: github-actions-backend-${{ github.run_id }}

      - name: Verify ECS task role SQS permissions
        run: |
          queue_arns=$(printf '%s\n' "$SQS_PROCESSING_QUEUE_URL" "$SQS_STORY_QUEUE_URL" "$SQS_VIDEO_QUEUE_URL" "$SQS_RENDER_QUEUE_URL" | sed -E 's#https://sqs\.([^.]+)\.amazonaws\.com/([^/]+)/([^/]+)#arn:aws:sqs:\1:\2:\3#' | paste -sd ' ' -)
          denied=$(aws iam simulate-principal-policy \
            --policy-source-arn "$ECS_TASK_ROLE_ARN" \
            --action-names sqs:SendMessage sqs:ReceiveMessage sqs:DeleteMessage sqs:ChangeMessageVisibility \
            --resource-arns $queue_arns \
            --query 'EvaluationResults[?EvalDecision!=`allowed`].[EvalActionName,EvalResourceName,EvalDecision]' \
            --output text)
          if [ -n "$denied" ] && [ "$denied" != "None" ]; then
            echo "ECS task role is missing required SQS permissions:" >&2
            echo "$denied" >&2
            exit 1
          fi
          echo "ECS task role SQS permissions verified for all configured queues."

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "$ECR_REPOSITORY" >/dev/null

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "image=$REGISTRY/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag "$IMAGE:$SHA_TAG" \
            --tag "$IMAGE:latest" \
            .

      - name: Push Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:latest"

      - name: Deploy ECS service
        env:
          IMAGE: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
        run: bash ./scripts/deploy-ecs-service.sh
