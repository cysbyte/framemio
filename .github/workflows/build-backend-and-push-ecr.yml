name: Build and push backend image to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/build-backend-and-push-ecr.yml'
      - 'scripts/deploy-ecs-service.sh'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: my-cluster
  ECS_SERVICE: framemio-backend-service-bvglq3iy
  ECS_TASK_DEFINITION: framemio-backend
  ECS_CONTAINER_NAME: Main
  ECS_TASK_ROLE_ARN: arn:aws:iam::450876624497:role/FramemioECSTaskRole
  ECS_EXECUTION_ROLE_ARN: arn:aws:iam::450876624497:role/ecsTaskExecutionRole
  ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
  ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
  ECS_ASSIGN_PUBLIC_IP: ${{ vars.ECS_ASSIGN_PUBLIC_IP }}
  DATABASE_URL: ${{ vars.DATABASE_URL }}
  DATABASE_AUTH_MODE: iam
  PORT: "8080"
  ECS_WORKER_RUN_TASK_ENABLED: "true"
  ECS_WORKER_CLUSTER: my-cluster
  ECS_WORKER_SUBNETS: ${{ vars.ECS_SUBNETS }}
  ECS_WORKER_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
  ECS_WORKER_ASSIGN_PUBLIC_IP: ${{ vars.ECS_ASSIGN_PUBLIC_IP || 'ENABLED' }}
  VIDEO_WORKER_TASK_DEFINITION: framemio-video-intelligence-worker
  VIDEO_WORKER_CONTAINER_NAME: Main
  RENDER_WORKER_TASK_DEFINITION: framemio-render-worker
  RENDER_WORKER_CONTAINER_NAME: Main
  ECS_SET_ENV_VARS: DATABASE_URL,DATABASE_AUTH_MODE,AWS_REGION,PORT,ECS_WORKER_RUN_TASK_ENABLED,ECS_WORKER_CLUSTER,ECS_WORKER_SUBNETS,ECS_WORKER_SECURITY_GROUPS,ECS_WORKER_ASSIGN_PUBLIC_IP,VIDEO_WORKER_TASK_DEFINITION,VIDEO_WORKER_CONTAINER_NAME,RENDER_WORKER_TASK_DEFINITION,RENDER_WORKER_CONTAINER_NAME

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: ${{ vars.BACKEND_ECR_REPOSITORY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment variables
        env:
          ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        run: |
          test -n "$AWS_REGION" || { echo "Missing repository variable AWS_REGION"; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo "Missing repository variable BACKEND_ECR_REPOSITORY"; exit 1; }
          test -n "$ROLE_ARN" || { echo "Missing repository secret AWS_GITHUB_ACTIONS_ROLE_ARN"; exit 1; }
          test -n "$DATABASE_URL" || { echo "Missing repository variable DATABASE_URL"; exit 1; }
          test -n "$ECS_WORKER_SUBNETS" || { echo "Missing repository variable ECS_SUBNETS"; exit 1; }
          test -n "$ECS_WORKER_SECURITY_GROUPS" || { echo "Missing repository variable ECS_SECURITY_GROUPS"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-skip-session-tagging: true
          role-session-name: github-actions-backend-${{ github.run_id }}

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "$ECR_REPOSITORY" >/dev/null

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "image=$REGISTRY/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag "$IMAGE:$SHA_TAG" \
            --tag "$IMAGE:latest" \
            .

      - name: Push Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:latest"

      - name: Deploy ECS service
        env:
          IMAGE: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
        run: bash ./scripts/deploy-ecs-service.sh
