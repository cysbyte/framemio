name: Build and push video intelligence worker image to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'video-intelligence-worker/**'
      - '.github/workflows/build-video-intelligence-worker-and-push-ecr.yml'
      - 'scripts/deploy-ecs-service.sh'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: my-cluster
  ECS_SERVICE: framemio-video-intelligence-worker-service-xuttbpns
  ECS_TASK_DEFINITION: framemio-video-intelligence-worker
  ECS_CONTAINER_NAME: Main
  ECS_TASK_ROLE_ARN: arn:aws:iam::450876624497:role/FramemioECSTaskRole
  ECS_EXECUTION_ROLE_ARN: arn:aws:iam::450876624497:role/ecsTaskExecutionRole
  ECS_TASK_CPU: ${{ vars.VIDEO_WORKER_ECS_TASK_CPU || '2048' }}
  ECS_TASK_MEMORY: ${{ vars.VIDEO_WORKER_ECS_TASK_MEMORY || '6144' }}
  ECS_SERVICE_DESIRED_COUNT: 0
  ECS_PRESERVE_DESIRED_COUNT: "true"
  ECS_REGISTER_SCALABLE_TARGET: "true"
  ECS_MIN_CAPACITY: 0
  ECS_MAX_CAPACITY: ${{ vars.VIDEO_WORKER_ECS_MAX_CAPACITY || '4' }}
  ECS_CONTAINER_STOP_TIMEOUT: 120
  ECS_ENABLE_SQS_AUTOSCALING: "true"
  ECS_SQS_QUEUE_URL: ${{ vars.SQS_VIDEO_QUEUE_URL || 'https://sqs.us-east-1.amazonaws.com/450876624497/framemio-video-analysis' }}
  ECS_SQS_SCALE_IN_EVALUATION_PERIODS: 2
  ECS_SQS_SCALE_IN_COOLDOWN: 300
  ECS_SQS_SCALE_OUT_CAPACITY: ${{ vars.VIDEO_WORKER_ECS_SCALE_OUT_CAPACITY || '4' }}
  ECS_SUBNETS: ${{ vars.ECS_SUBNETS || 'subnet-00d486ccc47c106c3,subnet-049030ce471097336,subnet-09957911ba06c489f,subnet-0207cfb1b59d111c0,subnet-059002c34faa60a13,subnet-0b38a6af4a720b169' }}
  ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS || 'sg-0621dd1b1173bd1c0' }}
  ECS_ASSIGN_PUBLIC_IP: ${{ vars.ECS_ASSIGN_PUBLIC_IP || 'ENABLED' }}
  DATABASE_PROVIDER: ${{ vars.DATABASE_PROVIDER || 'rds' }}
  DATABASE_URL: ${{ vars.DATABASE_URL }}
  DATABASE_URL_SECRET_ARN: ${{ vars.DATABASE_URL_SECRET_ARN || vars.NEON_DATABASE_URL_SECRET_ARN }}
  DATABASE_AUTH_MODE: ${{ vars.DATABASE_AUTH_MODE }}
  RDS_AUTO_START_ENABLED: ${{ vars.RDS_AUTO_START_ENABLED }}
  RDS_CLUSTER_IDENTIFIER: ${{ vars.RDS_CLUSTER_IDENTIFIER || 'my-db-cluster' }}
  VIDEO_UNDERSTANDING_PROVIDER: openai-direct
  VIDEO_UNDERSTANDING_MODEL: gpt-5.6-luna
  VIDEO_UNDERSTANDING_DIRECT: "true"
  VIDEO_UNDERSTANDING_UPSTREAM_BASE_URL: https://api2.65535.space
  VIDEO_UNDERSTANDING_WIRE_API: chat_completions
  VIDEO_UNDERSTANDING_IMAGE_DETAIL: low
  VIDEO_UNDERSTANDING_MAX_OUTPUT_TOKENS: "5000"
  VIDEO_UNDERSTANDING_PROVIDER_TIMEOUT: ${{ vars.VIDEO_UNDERSTANDING_PROVIDER_TIMEOUT || '180s' }}
  ENABLE_TRANSCRIPTION: "true"
  TRANSCRIPTION_PROVIDER: deepgram
  TRANSCRIPTION_MODEL: nova-3
  TRANSCRIPTION_DIRECT: "false"
  TRANSCRIPTION_UPSTREAM_BASE_URL: https://api.deepgram.com
  DEEPGRAM_BASE_URL: https://api.deepgram.com
  DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
  BACKEND_INTERNAL_API_URL: ${{ vars.BACKEND_INTERNAL_API_URL }}
  INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
  SQS_VIDEO_QUEUE_URL: ${{ vars.SQS_VIDEO_QUEUE_URL || 'https://sqs.us-east-1.amazonaws.com/450876624497/framemio-video-analysis' }}
  SQS_VIDEO_ANALYSIS_QUEUE_URL: ${{ vars.SQS_VIDEO_QUEUE_URL || 'https://sqs.us-east-1.amazonaws.com/450876624497/framemio-video-analysis' }}
  SQS_VISIBILITY_TIMEOUT: ${{ vars.VIDEO_WORKER_SQS_VISIBILITY_TIMEOUT || '240s' }}
  MAX_SEGMENT_DURATION: ${{ vars.VIDEO_WORKER_MAX_SEGMENT_DURATION || '5s' }}
  MAX_FRAMES_SHORT: ${{ vars.VIDEO_WORKER_MAX_FRAMES_SHORT || '12' }}
  MAX_FRAMES_LONG: ${{ vars.VIDEO_WORKER_MAX_FRAMES_LONG || '24' }}
  MAX_CANDIDATE_FRAMES: ${{ vars.VIDEO_WORKER_MAX_CANDIDATE_FRAMES || '450' }}
  MAX_MODEL_FRAMES_SHORT: ${{ vars.VIDEO_WORKER_MAX_MODEL_FRAMES_SHORT || '120' }}
  MAX_MODEL_FRAMES_MEDIUM: ${{ vars.VIDEO_WORKER_MAX_MODEL_FRAMES_MEDIUM || '120' }}
  MAX_MODEL_FRAMES_LONG: ${{ vars.VIDEO_WORKER_MAX_MODEL_FRAMES_LONG || '150' }}
  MAX_MODEL_FRAMES_VERY_LONG: ${{ vars.VIDEO_WORKER_MAX_MODEL_FRAMES_VERY_LONG || '180' }}
  ECS_SET_ENV_VARS: DATABASE_PROVIDER,DATABASE_URL,DATABASE_AUTH_MODE,AWS_REGION,SQS_VIDEO_QUEUE_URL,SQS_VIDEO_ANALYSIS_QUEUE_URL,ENABLE_TRANSCRIPTION,VIDEO_UNDERSTANDING_PROVIDER,VIDEO_UNDERSTANDING_MODEL,VIDEO_UNDERSTANDING_DIRECT,VIDEO_UNDERSTANDING_UPSTREAM_BASE_URL,VIDEO_UNDERSTANDING_WIRE_API,VIDEO_UNDERSTANDING_IMAGE_DETAIL,VIDEO_UNDERSTANDING_MAX_OUTPUT_TOKENS,VIDEO_UNDERSTANDING_PROVIDER_TIMEOUT,TRANSCRIPTION_PROVIDER,TRANSCRIPTION_MODEL,TRANSCRIPTION_DIRECT,TRANSCRIPTION_UPSTREAM_BASE_URL,DEEPGRAM_BASE_URL,DEEPGRAM_API_KEY,BACKEND_INTERNAL_API_URL,INTERNAL_API_TOKEN,SQS_VISIBILITY_TIMEOUT,MAX_SEGMENT_DURATION,MAX_FRAMES_SHORT,MAX_FRAMES_LONG,MAX_CANDIDATE_FRAMES,MAX_MODEL_FRAMES_SHORT,MAX_MODEL_FRAMES_MEDIUM,MAX_MODEL_FRAMES_LONG,MAX_MODEL_FRAMES_VERY_LONG

jobs:
  build-and-push:
    name: Build and push video intelligence worker image
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: ${{ vars.VIDEO_INTELLIGENCE_WORKER_ECR_REPOSITORY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve database deployment config
        run: |
          if [ -n "$DATABASE_URL_SECRET_ARN" ]; then
            echo "ECS_SET_SECRET_ENV_VARS=DATABASE_URL" >> "$GITHUB_ENV"
          fi

          case "$DATABASE_PROVIDER" in
            rds|aurora|aws-rds)
              echo "DATABASE_AUTH_MODE=${DATABASE_AUTH_MODE:-iam}" >> "$GITHUB_ENV"
              echo "RDS_AUTO_START_ENABLED=${RDS_AUTO_START_ENABLED:-false}" >> "$GITHUB_ENV"
              ;;
            neon)
              echo "DATABASE_AUTH_MODE=${DATABASE_AUTH_MODE:-password}" >> "$GITHUB_ENV"
              echo "RDS_AUTO_START_ENABLED=${RDS_AUTO_START_ENABLED:-false}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported DATABASE_PROVIDER: $DATABASE_PROVIDER" >&2
              exit 1
              ;;
          esac

      - name: Validate deployment variables
        env:
          ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        run: |
          test -n "$AWS_REGION" || { echo "Missing repository variable AWS_REGION"; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo "Missing repository variable VIDEO_INTELLIGENCE_WORKER_ECR_REPOSITORY"; exit 1; }
          test -n "$ROLE_ARN" || { echo "Missing repository secret AWS_GITHUB_ACTIONS_ROLE_ARN"; exit 1; }
          test -n "$DATABASE_PROVIDER" || { echo "Missing DATABASE_PROVIDER"; exit 1; }
          if [ -z "$DATABASE_URL" ] && [ -z "$DATABASE_URL_SECRET_ARN" ]; then
            echo "Missing DATABASE_URL repository variable or DATABASE_URL_SECRET_ARN repository variable" >&2
            exit 1
          fi
          test -n "$DATABASE_AUTH_MODE" || { echo "Missing DATABASE_AUTH_MODE"; exit 1; }
          test -n "$SQS_VIDEO_QUEUE_URL" || { echo "Missing SQS_VIDEO_QUEUE_URL"; exit 1; }
          test -n "$SQS_VIDEO_ANALYSIS_QUEUE_URL" || { echo "Missing SQS_VIDEO_ANALYSIS_QUEUE_URL"; exit 1; }
          test -n "$BACKEND_INTERNAL_API_URL" || { echo "Missing repository variable BACKEND_INTERNAL_API_URL"; exit 1; }
          test -n "$INTERNAL_API_TOKEN" || { echo "Missing repository secret INTERNAL_API_TOKEN"; exit 1; }
          test -n "$DEEPGRAM_API_KEY" || { echo "Missing repository secret DEEPGRAM_API_KEY"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-skip-session-tagging: true
          role-session-name: github-actions-video-worker-${{ github.run_id }}

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "$ECR_REPOSITORY" >/dev/null

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "image=$REGISTRY/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          docker build \
            --file video-intelligence-worker/Dockerfile \
            --tag "$IMAGE:$SHA_TAG" \
            --tag "$IMAGE:latest" \
            .

      - name: Push Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:latest"

      - name: Deploy ECS service
        env:
          IMAGE: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
        run: bash ./scripts/deploy-ecs-service.sh
