name: Build and push video intelligence worker image to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'video-intelligence-worker/**'
      - '.github/workflows/build-video-intelligence-worker-and-push-ecr.yml'
      - 'scripts/deploy-ecs-service.sh'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: my-cluster
  ECS_SERVICE: framemio-video-intelligence-worker-service-xuttbpns
  ECS_TASK_DEFINITION: framemio-video-intelligence-worker
  ECS_CONTAINER_NAME: Main
  ECS_TASK_ROLE_ARN: arn:aws:iam::450876624497:role/FramemioECSTaskRole
  ECS_EXECUTION_ROLE_ARN: arn:aws:iam::450876624497:role/ecsTaskExecutionRole
  ECS_SERVICE_DESIRED_COUNT: 0
  ECS_REGISTER_SCALABLE_TARGET: "true"
  ECS_MIN_CAPACITY: 0
  ECS_MAX_CAPACITY: 1
  ECS_SUBNETS: ${{ vars.ECS_SUBNETS || 'subnet-00d486ccc47c106c3,subnet-049030ce471097336,subnet-09957911ba06c489f,subnet-0207cfb1b59d111c0,subnet-059002c34faa60a13,subnet-0b38a6af4a720b169' }}
  ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS || 'sg-0621dd1b1173bd1c0' }}
  ECS_ASSIGN_PUBLIC_IP: ${{ vars.ECS_ASSIGN_PUBLIC_IP || 'ENABLED' }}
  DATABASE_URL: ${{ vars.DATABASE_URL }}
  DATABASE_AUTH_MODE: iam
  ECS_SET_ENV_VARS: DATABASE_URL,DATABASE_AUTH_MODE,AWS_REGION

jobs:
  build-and-push:
    name: Build and push video intelligence worker image
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: ${{ vars.VIDEO_INTELLIGENCE_WORKER_ECR_REPOSITORY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment variables
        env:
          ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        run: |
          test -n "$AWS_REGION" || { echo "Missing repository variable AWS_REGION"; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo "Missing repository variable VIDEO_INTELLIGENCE_WORKER_ECR_REPOSITORY"; exit 1; }
          test -n "$ROLE_ARN" || { echo "Missing repository secret AWS_GITHUB_ACTIONS_ROLE_ARN"; exit 1; }
          test -n "$DATABASE_URL" || { echo "Missing repository variable DATABASE_URL"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-skip-session-tagging: true
          role-session-name: github-actions-video-worker-${{ github.run_id }}

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "$ECR_REPOSITORY" >/dev/null

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "image=$REGISTRY/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          docker build \
            --file video-intelligence-worker/Dockerfile \
            --tag "$IMAGE:$SHA_TAG" \
            --tag "$IMAGE:latest" \
            .

      - name: Push Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:latest"

      - name: Deploy ECS service
        env:
          IMAGE: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
        run: bash ./scripts/deploy-ecs-service.sh
