name: Build and push render worker image to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'render-worker/**'
      - '.github/workflows/build-render-worker-and-push-ecr.yml'
      - 'scripts/deploy-ecs-service.sh'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECS_CLUSTER: my-cluster
  ECS_SERVICE: framemio-render-worker-service-chw8cyt4
  ECS_TASK_DEFINITION: framemio-render-worker
  ECS_CONTAINER_NAME: Main
  ECS_TASK_ROLE_ARN: arn:aws:iam::450876624497:role/FramemioECSTaskRole
  ECS_EXECUTION_ROLE_ARN: arn:aws:iam::450876624497:role/ecsTaskExecutionRole
  ECS_SERVICE_DESIRED_COUNT: 0
  ECS_PRESERVE_DESIRED_COUNT: "true"
  ECS_REGISTER_SCALABLE_TARGET: "true"
  ECS_MIN_CAPACITY: 0
  ECS_MAX_CAPACITY: 1
  ECS_CONTAINER_STOP_TIMEOUT: 120
  ECS_ENABLE_SQS_AUTOSCALING: "true"
  ECS_SQS_QUEUE_URL: ${{ vars.SQS_PROCESSING_QUEUE_URL || 'https://sqs.us-east-1.amazonaws.com/450876624497/framemio-processing' }}
  ECS_SQS_SCALE_IN_EVALUATION_PERIODS: 10
  ECS_SQS_SCALE_IN_COOLDOWN: 300
  ECS_SUBNETS: ${{ vars.ECS_SUBNETS || 'subnet-00d486ccc47c106c3,subnet-049030ce471097336,subnet-09957911ba06c489f,subnet-0207cfb1b59d111c0,subnet-059002c34faa60a13,subnet-0b38a6af4a720b169' }}
  ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS || 'sg-0621dd1b1173bd1c0' }}
  ECS_ASSIGN_PUBLIC_IP: ${{ vars.ECS_ASSIGN_PUBLIC_IP || 'ENABLED' }}
  S3_MEDIA_BUCKET: ${{ vars.S3_MEDIA_BUCKET }}
  SQS_PROCESSING_QUEUE_URL: ${{ vars.SQS_PROCESSING_QUEUE_URL || 'https://sqs.us-east-1.amazonaws.com/450876624497/framemio-processing' }}
  BACKEND_INTERNAL_API_URL: ${{ vars.BACKEND_INTERNAL_API_URL }}
  INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
  RENDERER_MODE: ffmpeg
  ECS_SET_ENV_VARS: S3_MEDIA_BUCKET,AWS_REGION,SQS_PROCESSING_QUEUE_URL,BACKEND_INTERNAL_API_URL,INTERNAL_API_TOKEN,RENDERER_MODE

jobs:
  build-and-push:
    name: Build and push render worker image
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: ${{ vars.RENDER_WORKER_ECR_REPOSITORY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment variables
        env:
          ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        run: |
          test -n "$AWS_REGION" || { echo "Missing repository variable AWS_REGION"; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo "Missing repository variable RENDER_WORKER_ECR_REPOSITORY"; exit 1; }
          test -n "$ROLE_ARN" || { echo "Missing repository secret AWS_GITHUB_ACTIONS_ROLE_ARN"; exit 1; }
          test -n "$S3_MEDIA_BUCKET" || { echo "Missing repository variable S3_MEDIA_BUCKET"; exit 1; }
          test -n "$SQS_PROCESSING_QUEUE_URL" || { echo "Missing repository variable SQS_PROCESSING_QUEUE_URL"; exit 1; }
          test -n "$BACKEND_INTERNAL_API_URL" || { echo "Missing repository variable BACKEND_INTERNAL_API_URL"; exit 1; }
          test -n "$INTERNAL_API_TOKEN" || { echo "Missing repository secret INTERNAL_API_TOKEN"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          role-skip-session-tagging: true
          role-session-name: github-actions-render-worker-${{ github.run_id }}

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "$ECR_REPOSITORY" >/dev/null

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "image=$REGISTRY/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          docker build \
            --file render-worker/Dockerfile \
            --tag "$IMAGE:$SHA_TAG" \
            --tag "$IMAGE:latest" \
            .

      - name: Push Docker image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SHA_TAG: ${{ steps.image.outputs.sha_tag }}
        run: |
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:latest"

      - name: Deploy ECS service
        env:
          IMAGE: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}
        run: bash ./scripts/deploy-ecs-service.sh
