name: iOS App Store Upload

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App Store version, for example 1.1
        required: true
        default: "1.1"
      build_number:
        description: Build number. Defaults to the GitHub run number when empty.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-appstore-upload
  cancel-in-progress: false

env:
  PROJECT_PATH: ios/FrameMio.xcodeproj
  SCHEME: FrameMio
  CONFIGURATION: Release
  BUNDLE_ID: com.framemio.app
  TEAM_ID: RAXZ4685K6

jobs:
  upload:
    name: Build and upload iOS app
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode and iOS SDK
        run: |
          set -euo pipefail

          xcodebuild -version
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: ${IOS_SDK_VERSION}"

          case "${IOS_SDK_VERSION}" in
            2[6-9]*|[3-9][0-9]*) ;;
            *)
              echo "App Store Connect requires iOS 26 SDK or later. Use a runner with Xcode 26 or later." >&2
              exit 1
              ;;
          esac

      - name: Prepare build values
        run: |
          set -euo pipefail

          BUILD_NUMBER="${{ inputs.build_number }}"
          if [ -z "${BUILD_NUMBER}" ]; then
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          fi

          echo "MARKETING_VERSION=${{ inputs.marketing_version }}" >> "${GITHUB_ENV}"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "${GITHUB_ENV}"
          echo "Using version ${{ inputs.marketing_version }} (${BUILD_NUMBER})"

      - name: Install signing certificate and profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="${RUNNER_TEMP}/apple_distribution.p12"
          PROFILE_PATH="${RUNNER_TEMP}/app_store.mobileprovision"
          PROFILE_PLIST="${RUNNER_TEMP}/app_store_profile.plist"
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "${CERTIFICATE_BASE64}" | base64 -D > "${CERTIFICATE_PATH}"
          echo "${PROVISION_PROFILE_BASE64}" | base64 -D > "${PROFILE_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"

          security cms -D -i "${PROFILE_PATH}" > "${PROFILE_PLIST}"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "${PROFILE_PLIST}")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "${PROFILE_PLIST}")"
          PROFILE_TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "${PROFILE_PLIST}")"

          if [ "${PROFILE_TEAM_ID}" != "${TEAM_ID}" ]; then
            echo "Provisioning profile team ${PROFILE_TEAM_ID} does not match expected team ${TEAM_ID}." >&2
            exit 1
          fi

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"
          echo "PROFILE_NAME=${PROFILE_NAME}" >> "${GITHUB_ENV}"
          echo "Installed provisioning profile: ${PROFILE_NAME}"

      - name: Archive
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -destination "generic/platform=iOS" \
            -archivePath "${RUNNER_TEMP}/FrameMio.xcarchive" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}"

      - name: Export IPA
        run: |
          set -euo pipefail

          EXPORT_OPTIONS_PLIST="${RUNNER_TEMP}/ExportOptions.plist"
          cat > "${EXPORT_OPTIONS_PLIST}" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "${RUNNER_TEMP}/FrameMio.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist "${EXPORT_OPTIONS_PLIST}"

      - name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.appstoreconnect/private_keys"
          echo "${API_KEY_BASE64}" | base64 -D > "${HOME}/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

          IPA_PATH="${RUNNER_TEMP}/export/FrameMio.ipa"
          if [ ! -f "${IPA_PATH}" ]; then
            IPA_PATH="$(find "${RUNNER_TEMP}/export" -name '*.ipa' -print -quit)"
          fi

          xcrun altool --upload-app \
            --type ios \
            --file "${IPA_PATH}" \
            --apiKey "${API_KEY_ID}" \
            --apiIssuer "${API_ISSUER_ID}"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framemio-ios-${{ inputs.marketing_version }}-${{ inputs.build_number || github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/FrameMio.xcarchive
          if-no-files-found: ignore

      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "${KEYCHAIN_PATH}" || true
          fi
